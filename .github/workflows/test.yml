# Runs the unit tests on every push and pull request. They need no database and no
# network, and read core's Demo class from a checkout.
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.0'
            core: release/7.0
          - php: '8.3'
            core: develop
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Check out core, whose Demo class the tests load
        uses: actions/checkout@v4
        with:
          repository: mindstellar/shopclass
          ref: ${{ matrix.core }}
          path: core

      - name: Run the tests
        run: SHOPCLASS_CORE="$PWD/core" ./tests/run.sh
